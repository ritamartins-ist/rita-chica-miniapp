<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votação de ideias | JUNITEC</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#175FAA;color:#F6F6F6;font-family:'Montserrat',Arial,sans-serif;font-weight:400;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:32px 20px}
h1{font-weight:700;font-size:30px;margin:0 0 10px}
.barra{width:120px;height:6px;background:#74D1EF;border-radius:6px;margin-bottom:16px}
.intro{color:#E2EEFF;margin:0 0 24px}
.cartao{background:#F6F6F6;color:#3D4F6B;border-radius:12px;padding:20px;margin-bottom:20px}
.cartao h2{color:#175FAA;font-weight:700;font-size:20px;margin:0 0 12px}
.aviso{font-size:13px;color:#3D4F6B}
.linha{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid #C9DAEE;border-radius:8px;color:#3D4F6B;background:#fff}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#74D1EF;color:#0944A1}
button.sec{background:#fff;border:1px solid #C9DAEE;color:#175FAA}
button:disabled{opacity:.45;cursor:not-allowed}
.ideia{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #C9DAEE}
.ideia:first-of-type{border-top:0}
.pos{font-weight:800;color:#175FAA;width:28px}
.txt{flex:1}
.txt small{color:#6B7C96;display:block}
.votos{background:#74D1EF;color:#0944A1;font-weight:800;border-radius:8px;min-width:44px;text-align:center;padding:6px 8px}
.empatada{outline:2px solid #74D1EF;outline-offset:2px;border-radius:8px}
.resultado{background:#175FAA;color:#F6F6F6;border-radius:12px;padding:20px;margin-bottom:20px;border:2px solid #74D1EF}
.resultado .grande{color:#74D1EF;font-weight:800;font-size:28px;margin:4px 0}
.resultado p{margin:0;color:#E2EEFF}
.duelo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.duelo div{border:1px solid #C9DAEE;border-radius:12px;padding:16px;text-align:center}
.duelo .n{color:#175FAA;font-weight:800;font-size:40px}
.acoes{display:flex;gap:10px;flex-wrap:wrap}
footer{font-size:12px;color:#E2EEFF;margin-top:24px}
@media(max-width:640px){.linha{flex-direction:column}.ideia{flex-wrap:wrap}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Votação de ideias</h1>
  <div class="barra"></div>
  <p class="intro">Junta as ideias do brainstorm e vota nas melhores. Feita para os membros de inovação da JUNITEC. Se houver empate, faz um desempate.</p>

  <div id="controlo"></div>
  <div id="resultado"></div>

  <div class="cartao">
    <h2 id="tituloAdd">Acrescentar ideia</h2>
    <div class="linha">
      <input id="novaIdeia" placeholder="Escreve a ideia" maxlength="120">
      <input id="novoAutor" placeholder="Autor (opcional)" maxlength="40">
      <button id="btnAdd">Acrescentar</button>
    </div>
    <p class="aviso">Os dados ficam guardados só neste browser (localStorage). As ideias iniciais são exemplos.</p>
  </div>

  <div id="desempate"></div>

  <div class="cartao">
    <h2>Ranking</h2>
    <div id="lista"></div>
    <div class="acoes" style="margin-top:14px">
      <button id="btnCopiar">Copiar resultado</button>
      <button class="sec" id="btnCsv">Exportar CSV</button>
      <button class="sec" id="btnLimpar">Repor exemplos</button>
    </div>
  </div>

  <footer>Feito pela JUNITEC</footer>
</div>

<script>
// ---------- Estado ----------
const EXEMPLOS = [
  {id:1,texto:"Exemplo: Newsletter mensal de inovação",autor:"Exemplo",votos:3},
  {id:2,texto:"Exemplo: Workshop de prototipagem rápida",autor:"Exemplo",votos:3},
  {id:3,texto:"Exemplo: Mentoria entre membros",autor:"Exemplo",votos:1}
];
let estado = carregar();

function carregar(){
  try{
    const g = localStorage.getItem("junitec-votacao");
    if(g){const s=JSON.parse(g);s.fase=s.fase||"votacao";return s;}
  }catch(e){}
  return novoEstado();
}
function novoEstado(){
  // fase: "preparacao" (recolher ideias), "votacao" (a decorrer) ou "terminada"
  return {ideias:JSON.parse(JSON.stringify(EXEMPLOS)),desempate:null,vencedor:null,fase:"votacao"};
}
function guardar(){
  try{localStorage.setItem("junitec-votacao",JSON.stringify(estado));}catch(e){}
}

// ---------- Caixas de diálogo ----------
// Caixas próprias: o confirm() e o alert() do browser são bloqueados em páginas incorporadas
function caixa(msg,aoConfirmar){
  const f = document.createElement("div");
  f.style.cssText = "position:fixed;inset:0;background:rgba(9,68,161,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10";
  f.innerHTML = '<div class="cartao" style="max-width:460px;margin:0"><p style="white-space:pre-wrap"></p><div class="acoes"><button data-ok>'+(aoConfirmar?'Confirmar':'OK')+'</button>'+(aoConfirmar?'<button class="sec" data-nao>Cancelar</button>':'')+'</div></div>';
  f.querySelector("p").textContent = msg;
  f.querySelector("[data-ok]").onclick = ()=>{f.remove();if(aoConfirmar)aoConfirmar();};
  const nao = f.querySelector("[data-nao]");
  if(nao) nao.onclick = ()=>f.remove();
  document.body.appendChild(f);
}
function perguntar(msg,aoConfirmar){caixa(msg,aoConfirmar);}
function avisar(msg){caixa(msg,null);}

// ---------- Cálculos ----------
function ordenadas(){
  return [...estado.ideias].sort((a,b)=>b.votos-a.votos);
}
// Ideias empatadas no primeiro lugar (só conta se tiverem votos)
function empatadas(){
  const max = Math.max(0,...estado.ideias.map(i=>i.votos));
  if(max===0) return [];
  const t = estado.ideias.filter(i=>i.votos===max);
  return t.length>=2 ? t : [];
}
function vencedorAtual(){
  if(estado.vencedor) return estado.ideias.find(i=>i.id===estado.vencedor);
  const o = ordenadas();
  if(o.length && o[0].votos>0 && empatadas().length===0) return o[0];
  return null;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- Acções ----------
function acrescentar(){
  const t = document.getElementById("novaIdeia").value.trim();
  const a = document.getElementById("novoAutor").value.trim();
  if(!t || estado.fase!=="preparacao") return;
  estado.ideias.push({id:Date.now(),texto:t,autor:a||"Sem autor",votos:0});
  estado.vencedor = null;
  document.getElementById("novaIdeia").value="";
  document.getElementById("novoAutor").value="";
  atualizar();
}
function votar(id,d){
  const i = estado.ideias.find(x=>x.id===id);
  if(estado.fase!=="votacao") return;
  i.votos = Math.max(0,i.votos+d);
  estado.vencedor = null;
  atualizar();
}
// Fase de votação: iniciar, acabar e recomeçar
function iniciarVotacao(){
  if(estado.ideias.length<2){avisar("Acrescenta pelo menos 2 ideias para iniciar a votação.");return;}
  estado.fase = "votacao";
  atualizar();
}
function acabarVotacao(){
  perguntar("Acabar a votação? Depois já não se pode votar.",acabarConfirmada);
}
function acabarConfirmada(){
  estado.fase = "terminada";
  atualizar();
}
function novaVotacao(){
  perguntar("Começar uma nova votação? Os votos voltam a zero e as ideias mantêm-se.",novaVotacaoConfirmada);
}
function novaVotacaoConfirmada(){
  estado.ideias.forEach(i=>i.votos=0);
  estado.desempate = null;
  estado.vencedor = null;
  estado.fase = "preparacao";
  atualizar();
}
function iniciarDesempate(){
  const ids = empatadas().map(i=>i.id);
  const v = {}; ids.forEach(id=>v[id]=0);
  estado.desempate = {ids:ids,votos:v};
  atualizar();
}
function votarDesempate(id,d){
  const v = estado.desempate.votos;
  v[id] = Math.max(0,v[id]+d);
  atualizar();
}
function terminarDesempate(){
  const d = estado.desempate;
  const max = Math.max(...d.ids.map(id=>d.votos[id]));
  const topo = d.ids.filter(id=>d.votos[id]===max);
  if(max>0 && topo.length===1){
    estado.vencedor = topo[0];
    estado.desempate = null;
  }else{
    // Continua empatado: nova ronda só com as ideias empatadas
    const v = {}; topo.forEach(id=>v[id]=0);
    estado.desempate = {ids:topo,votos:v,repetida:true};
  }
  atualizar();
}
function cancelarDesempate(){
  estado.desempate = null;
  atualizar();
}
function textoResultado(){
  const v = vencedorAtual();
  const linhas = ordenadas().map((i,n)=>(n+1)+". "+i.texto+" ("+i.votos+" votos)");
  return (v?"Ideia vencedora: "+v.texto+"\n\n":"Ainda sem vencedora.\n\n")+linhas.join("\n");
}
function copiar(){
  const t = textoResultado();
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>avisar("Resultado copiado."),()=>avisar(t));
  else avisar(t);
}
function exportarCsv(){
  let csv = "posicao;ideia;autor;votos\n";
  ordenadas().forEach((i,n)=>{
    csv += (n+1)+";\""+i.texto.replace(/"/g,'""')+"\";\""+i.autor.replace(/"/g,'""')+"\";"+i.votos+"\n";
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));
  a.download = "votacao-ideias.csv";
  a.click();
}
function repor(){
  perguntar("Apagar todas as ideias e voltar aos exemplos?",reporConfirmado);
}
function reporConfirmado(){
  {
    estado = novoEstado();
    atualizar();
  }
}

// ---------- Interface ----------
function desenhar(){
  const emDuelo = !!estado.desempate;
  const emp = empatadas().map(i=>i.id);
  const fase = estado.fase;

  // Controlo da votação (iniciar / acabar / nova)
  let c = '<div class="cartao"><h2>Estado da votação</h2>';
  if(fase==="preparacao"){
    c += '<p>A recolher ideias. A votação ainda não começou.</p><button id="btnIniciaVot">Iniciar votação</button>';
  }else if(fase==="votacao"){
    c += '<p>Votação a decorrer. Já não se podem acrescentar ideias.</p><button id="btnAcabaVot">Acabar votação</button>';
  }else{
    c += '<p>Votação terminada. Já não se pode votar.</p><button class="sec" id="btnNovaVot">Nova votação</button>';
  }
  document.getElementById("controlo").innerHTML = c + '</div>';
  // Só se acrescentam ideias antes de a votação começar
  document.getElementById("tituloAdd").parentElement.style.display = fase==="preparacao" ? "" : "none";

  // Resultado em destaque (só quando a votação termina)
  const v = fase==="terminada" ? vencedorAtual() : null;
  let r = "";
  if(v){
    r = '<div class="resultado"><p>Ideia vencedora</p><div class="grande">'+esc(v.texto)+'</div><p>'+(estado.vencedor?"Decidida no desempate":v.votos+" votos")+'</p></div>';
  }else if(fase==="terminada" && emp.length>=2 && !emDuelo){
    r = '<div class="resultado"><p>Empate no primeiro lugar</p><div class="grande">'+emp.length+' ideias empatadas</div><p>Faz um desempate para escolher uma.</p></div>';
  }
  document.getElementById("resultado").innerHTML = r;

  // Cartão de desempate
  let d = "";
  if(emDuelo){
    const ds = estado.desempate;
    d = '<div class="cartao"><h2>Desempate</h2><p class="aviso">'+(ds.repetida?"Continua empatado. Nova ronda só com estas ideias.":"Votação só entre as ideias empatadas.")+'</p><div class="duelo">';
    ds.ids.forEach(id=>{
      const i = estado.ideias.find(x=>x.id===id);
      d += '<div><strong>'+esc(i.texto)+'</strong><div class="n">'+ds.votos[id]+'</div>'+
        '<div class="acoes" style="justify-content:center"><button data-dv="'+id+'" data-d="1">+1</button><button class="sec" data-dv="'+id+'" data-d="-1">−1</button></div></div>';
    });
    d += '</div><div class="acoes"><button id="btnFim">Terminar desempate</button><button class="sec" id="btnCancela">Cancelar</button></div></div>';
  }else if(fase==="terminada" && emp.length>=2 && !estado.vencedor){
    d = '<div class="cartao"><h2>Empate</h2><p>'+emp.length+' ideias têm os mesmos votos no topo.</p><button id="btnInicia">Iniciar desempate</button></div>';
  }
  document.getElementById("desempate").innerHTML = d;

  // Lista de ideias
  let l = "";
  ordenadas().forEach((i,n)=>{
    l += '<div class="ideia"><div class="pos">'+(n+1)+'</div><div class="txt '+(emp.includes(i.id)?'empatada':'')+'">'+esc(i.texto)+'<small>'+esc(i.autor)+'</small></div>'+
      '<div class="votos">'+i.votos+'</div>'+
      '<button data-v="'+i.id+'" data-d="1"'+(fase!=="votacao"?' disabled':'')+'>+1</button>'+
      '<button class="sec" data-v="'+i.id+'" data-d="-1"'+(fase!=="votacao"?' disabled':'')+'>−1</button></div>';
  });
  document.getElementById("lista").innerHTML = l || "<p>Ainda não há ideias.</p>";
}
function atualizar(){guardar();desenhar();}

// Eventos (delegação, porque a interface é redesenhada)
document.getElementById("btnAdd").onclick = acrescentar;
document.getElementById("novaIdeia").onkeydown = e=>{if(e.key==="Enter")acrescentar();};
document.getElementById("btnCopiar").onclick = copiar;
document.getElementById("btnCsv").onclick = exportarCsv;
document.getElementById("btnLimpar").onclick = repor;
document.body.addEventListener("click",e=>{
  const b = e.target.closest("button");
  if(!b) return;
  if(b.dataset.v) votar(Number(b.dataset.v),Number(b.dataset.d));
  if(b.dataset.dv) votarDesempate(Number(b.dataset.dv),Number(b.dataset.d));
  if(b.id==="btnInicia") iniciarDesempate();
  if(b.id==="btnFim") terminarDesempate();
  if(b.id==="btnCancela") cancelarDesempate();
  if(b.id==="btnIniciaVot") iniciarVotacao();
  if(b.id==="btnAcabaVot") acabarVotacao();
  if(b.id==="btnNovaVot") novaVotacao();
});

desenhar();
</script>
</body>
</html>
